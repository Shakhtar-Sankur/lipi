[project]
name = "lipi"
version = "0.1.0"
description = "The token tax on Indian languages, measured and fixed"
requires-python = ">=3.10"
dependencies = ["tokenizers>=0.20", "tiktoken>=0.7", "regex>=2024.4"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
